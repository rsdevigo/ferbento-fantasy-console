name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Ferbento.sln
      - run: dotnet build Ferbento.sln --no-restore -c Debug
      - run: dotnet test Ferbento.sln --no-restore --no-build -c Debug
